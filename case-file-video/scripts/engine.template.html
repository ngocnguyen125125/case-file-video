<!-- TOPIC: page title (2-4 word name) -->
<title>The Token Case File</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Old+Standard+TT:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: one 9:16 "film" stage (720x1280 design units) scaled to fit, with a slim control deck under it.
   Single committed look: a noir detective's desk at night. */
:root{
  --desk:#140f0b;        /* desk in shadow */
  --lamp:#f3c98a;        /* warm lamp light */
  --paper:#ece2c8;       /* aged paper */
  --ink:#1c1915;         /* typewriter ink */
  --evidence:#b3231d;    /* stamp + string red */
  --tape:#e9b82a;        /* evidence-tape yellow */
  --ui:#e8dcc4;          /* control text */
  --ui-dim:#9c8f78;
  --ui-line:#3a2f24;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;
  --f-type:'Special Elite','Courier Prime','Courier New',monospace;
  --f-mono:'Courier Prime','Courier New',monospace;
  --f-news:'Old Standard TT','Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ui);font-family:var(--f-mono);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:10px}
.stage-wrap{position:relative;flex:0 0 auto}
.stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;overflow:hidden;background:var(--desk);
  border-radius:6px;box-shadow:0 0 0 1px #2a2119,0 20px 60px rgba(0,0,0,.6)}
.stage *{box-sizing:border-box}
.desk{position:absolute;inset:0;background-size:720px 1280px}
.blinds{position:absolute;inset:-200px;pointer-events:none;mix-blend-mode:screen;
  background:repeating-linear-gradient(-24deg,rgba(255,206,140,.085) 0 30px,transparent 30px 66px);
  -webkit-mask-image:radial-gradient(ellipse 60% 48% at 62% 42%,#000 25%,transparent 75%);
  mask-image:radial-gradient(ellipse 60% 48% at 62% 42%,#000 25%,transparent 75%);
  animation:blinds 40s ease-in-out infinite alternate}
@keyframes blinds{to{transform:translate(26px,10px)}}
#dust{position:absolute;inset:0;pointer-events:none}

/* header above the board */
.head{position:absolute;left:0;right:0;top:268px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5}
.kicker{font-family:var(--f-type);font-size:16px;color:var(--ink);background:var(--paper);padding:5px 12px 3px;letter-spacing:.5px}
.title{font-family:var(--f-display);font-size:46px;line-height:1;color:#141210;background:var(--tape);padding:9px 20px 5px;
  text-transform:uppercase;letter-spacing:1px;max-width:680px;text-align:center;text-wrap:balance}
.head .in{animation:hin .58s steps(7,end) both}
.head .in.from-r{--hx:80px}
@keyframes hin{from{opacity:0;transform:translateX(var(--hx,-80px)) rotate(var(--r,0deg));filter:blur(4px)}to{opacity:1;transform:rotate(var(--r,0deg));filter:blur(0)}}
.caption .line.fresh{animation:capin .28s ease-out both}
@keyframes capin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* the cork board */
.board{position:absolute;left:0;top:437px;width:720px;height:405px;overflow:hidden;background-size:720px 405px;z-index:4;
  box-shadow:0 10px 30px rgba(0,0,0,.65),inset 0 0 0 7px #2b1d12,inset 0 0 0 9px #4a3220,inset 0 0 40px rgba(0,0,0,.55)}
.layer{position:absolute;inset:0}
.layer.out{animation:outgo .42s ease-in both;z-index:2}
.layer.enter{animation:enter .75s cubic-bezier(.2,.7,.2,1) both}
@keyframes outgo{to{opacity:0;transform:scale(1.035);filter:blur(3px)}}
@keyframes enter{from{transform:scale(1.06);filter:blur(2.5px)}to{transform:none;filter:blur(0)}}
.cam{position:absolute;inset:0;transform-origin:var(--ko,50% 50%);animation:push 14s cubic-bezier(.37,0,.63,1) both}
@keyframes push{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--kx,0px),var(--ky,0px)) scale(var(--ks,1.05))}}
.board.shake{animation:shake .22s linear}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,1px)}}
.board-glare{position:absolute;inset:0;pointer-events:none;z-index:95;
  background:radial-gradient(ellipse at 60% 30%,rgba(255,220,160,.10),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(20,10,0,.45) 100%)}

.abs{position:absolute}
.stage{--sh:drop-shadow(0 0 0 transparent)}
.shadow{--sh:drop-shadow(1px 3px 3px rgba(0,0,0,.5));filter:var(--sh)}
.shadow-lg{--sh:drop-shadow(3px 8px 8px rgba(0,0,0,.55));filter:var(--sh)}
.paper{background-color:var(--paper);background-size:256px}
.manila{background-color:#d8bd83;background-size:256px}
.card{background-color:#f1ead6;font-family:var(--f-type);color:var(--ink);font-size:12px;line-height:17px;padding:12px 14px;
  background-image:repeating-linear-gradient(transparent 0 16px,rgba(80,110,150,.25) 16px 17px)}
.strip{background:#efe9da;padding:3px 8px 2px;font-family:var(--f-type);color:#2a2620;font-size:12px;white-space:nowrap}
.chip{background-color:#e7e0cc;font-family:var(--f-mono);font-weight:700;color:#1f1b15;font-size:30px;line-height:1.15;padding:9px 16px 7px;white-space:nowrap}
.chip.np-serif{font-family:var(--f-news);font-weight:700;letter-spacing:-.5px}
.chip.np-head{font-family:var(--f-display);font-weight:400;letter-spacing:.5px;text-transform:uppercase;font-size:.92em}
.chip.np-inv{background-color:#1e1c19;color:#eee6d2;font-family:var(--f-news);font-weight:700}
.strip{background-color:#e9e2cf}
.yellow{background:var(--tape);font-family:var(--f-display);color:#151310;text-transform:uppercase;padding:4px 12px 2px;letter-spacing:.5px;white-space:nowrap;font-size:30px}
.news{width:200px;background:#d8d0bd;padding:8px;font-family:var(--f-news);font-size:6.3px;line-height:7.6px;color:#4f4a40;text-align:justify;column-count:2;column-gap:8px}
.news h4{font-weight:700;font-size:12px;line-height:12px;color:#2e2a24;margin:0 0 4px;text-transform:uppercase;column-span:all}
.news p{margin:0 0 3px;text-indent:6px}
.tape{position:absolute;width:62px;height:20px;background:rgba(226,214,170,.72);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:60;
  clip-path:polygon(0 8%,6% 0,12% 10%,20% 2%,30% 8%,42% 0,55% 9%,66% 1%,78% 8%,90% 0,100% 7%,96% 52%,100% 95%,88% 100%,76% 91%,64% 100%,50% 92%,38% 100%,26% 91%,14% 100%,0 93%,4% 50%)}
.stamp{font-family:var(--f-display);color:var(--evidence);border:3.5px solid var(--evidence);padding:2px 10px 0;letter-spacing:2px;text-transform:uppercase;
  mix-blend-mode:multiply;opacity:.9;white-space:nowrap;outline:1.5px solid var(--evidence);outline-offset:2px;z-index:70}
.stamp.round{border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;outline:none;border-width:3px;line-height:1.05}
.pin{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;z-index:80;
  background:radial-gradient(circle at 35% 30%,#ff8a7a 0 12%,#d42a1f 35%,#7d0d08 100%);box-shadow:2px 3px 3px rgba(0,0,0,.5)}
.pin.brass{background:radial-gradient(circle at 35% 30%,#fff1b8 0 12%,#c79a32 40%,#5e420c 100%);width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
svg.strings{position:absolute;left:0;top:0;width:720px;height:405px;z-index:78;pointer-events:none;overflow:visible}
svg.strings path{stroke:var(--evidence);stroke-width:2.3;fill:none;filter:url(#ss)}
.censor{position:absolute;background:#0b0b0b;z-index:23}
.cut{position:absolute;border-left:2.5px dashed var(--evidence);z-index:12}
.blank{display:inline-block;min-width:92px;border-bottom:3px solid var(--evidence);margin-left:8px;height:30px;vertical-align:-4px}

/* entrance states */
.pre{opacity:0}
.in.a-drop{animation:drop .48s cubic-bezier(.2,1.35,.4,1) both}
.in.a-base{animation:none;opacity:1}
.in.a-wipe{animation:wipe .75s steps(9,end) both}
.in.a-slam{animation:slam .25s steps(1,end) both}
.in.a-pop{animation:pinIn .17s steps(1,end) both}
.in.a-fade{animation:fade .5s ease both}
.in.a-draw{animation:draw .75s steps(9,end) both}
.in.a-hop{animation:hop .92s steps(5,end) both}
@keyframes drop{from{opacity:0;transform:translateY(-22px) scale(1.2) rotate(calc(var(--r,0deg) + 5deg))}55%{opacity:1}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes wipe{from{opacity:1;clip-path:inset(-30px 100% -30px -30px)}to{opacity:1;clip-path:inset(-30px -30px -30px -30px)}}
@keyframes slide{from{opacity:1;transform:translate(var(--fx,0px),var(--fy,0px)) rotate(calc(var(--r,0deg) + var(--fr,0deg)));filter:blur(4px) var(--sh)}
 55%{filter:blur(0px) var(--sh)}
 80%{transform:translate(calc(var(--fx,0px) * -.018),calc(var(--fy,0px) * -.018)) rotate(var(--r,0deg))}
 to{opacity:1;transform:translate(0,0) rotate(var(--r,0deg));filter:blur(0px) var(--sh)}}
@keyframes slam{0%{opacity:.85;transform:scale(2.6) rotate(calc(var(--r,0deg) - 7deg));filter:blur(3px)}
 33%{opacity:.9;transform:scale(1.45) rotate(calc(var(--r,0deg) - 3deg));filter:blur(1px)}
 66%{opacity:.95;transform:scale(.96) rotate(var(--r,0deg));filter:blur(0)}
 100%{opacity:.9;transform:scale(1) rotate(var(--r,0deg));filter:blur(0)}}
@keyframes pinIn{0%{opacity:1;transform:translateY(-26px) scale(1.55);box-shadow:10px 18px 10px rgba(0,0,0,.18)}50%{opacity:1;transform:translateY(-7px) scale(1.15);box-shadow:5px 9px 6px rgba(0,0,0,.3)}100%{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{opacity:1;stroke-dashoffset:var(--len)}to{opacity:1;stroke-dashoffset:0}}
@keyframes hop{0%{opacity:1;transform:translate(0,0) rotate(var(--r,0deg))}45%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.5 - 40px)) rotate(0deg) scale(1.08)}100%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(0deg)}}
.boil{animation:boil .5s steps(1,end) infinite}
@keyframes boil{0%{translate:0 0;rotate:0deg}33%{translate:.6px -.5px;rotate:.18deg}66%{translate:-.5px .4px;rotate:-.14deg}}
.stage.paused *,.stage.paused{animation-play-state:paused!important}

/* captions under the board */
.caption{position:absolute;left:36px;right:36px;top:880px;text-align:center;z-index:6;min-height:90px}
.caption .line{display:inline;font-family:var(--f-mono);font-weight:700;font-size:28px;line-height:44px;color:var(--ink);background:var(--paper);
  padding:4px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.caption .w.now{background:var(--evidence);color:#fff;box-shadow:0 0 0 3px var(--evidence)}
.caption.off{display:none}
.counter{position:absolute;left:0;right:0;top:1150px;display:flex;justify-content:center;gap:8px;z-index:6}
.counter i{width:22px;height:6px;background:#3a2c20;display:block;transform:skewX(-20deg)}
.counter i.done{background:#8a6a44}.counter i.cur{background:var(--tape)}
.handle{position:absolute;left:0;right:0;top:1190px;text-align:center;font-family:var(--f-type);font-size:15px;color:#8f7c61;letter-spacing:2px;z-index:6}

/* start + end overlay */
.overlay{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;padding-bottom:150px;
  background:linear-gradient(to bottom,rgba(10,7,5,.1) 0%,rgba(10,7,5,.25) 55%,rgba(10,7,5,.92) 82%)}
.overlay[hidden]{display:none}
.big-btn{font-family:var(--f-display);font-size:40px;letter-spacing:2px;text-transform:uppercase;color:#141210;background:var(--tape);border:0;
  padding:16px 34px 12px;cursor:pointer;transform:rotate(-1.5deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.big-btn:hover{filter:brightness(1.08)}
.big-btn:focus-visible,.ctl button:focus-visible,.ctl select:focus-visible{outline:3px solid #fff;outline-offset:3px}
.overlay p{font-family:var(--f-type);font-size:17px;color:#d9ccb0;text-align:center;max-width:520px;line-height:1.5;margin:0}

/* control deck */
.ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 10px;max-width:100%;font-size:13px}
.ctl button,.ctl select{font-family:var(--f-mono);font-size:13px;color:var(--ui);background:#211912;border:1px solid var(--ui-line);border-radius:4px;padding:7px 11px;cursor:pointer}
.ctl button:hover,.ctl select:hover{border-color:#6b5638}
.ctl button[aria-pressed="false"]{color:var(--ui-dim);text-decoration:line-through}
.ctl select{max-width:210px}
.ctl .status{color:var(--ui-dim);font-size:12px;min-width:0;text-align:center;flex-basis:100%}
html.exporting body{padding:0!important}html.exporting .ctl{display:none}html.exporting .app{padding:0;justify-content:flex-start;align-items:flex-start}
html.exporting .stage{border-radius:0;box-shadow:none}html.exporting .overlay{display:none!important}
@media (prefers-reduced-motion:reduce){.blinds{animation:none}.cam{animation:none}.boil{animation:none}.in.a-slam,.layer.enter,.layer.out{animation-name:fade}}
</style>

<div class="app">
  <div class="stage-wrap" id="wrap">
    <div class="stage" id="stage">
      <div class="desk" id="desk"></div>
      <div class="blinds"></div>
      <canvas id="dust" width="720" height="1280"></canvas>
      <div class="head" id="head"></div>
      <div class="board" id="board"><div class="board-glare"></div></div>
      <div class="caption" id="cap"></div>
      <div class="counter" id="counter"></div>
      <!-- TOPIC: series / channel line -->
      <div class="handle">CASE FILES · AI EXPLAINED</div>
      <div class="overlay" id="startOv">
        <button class="big-btn" id="startBtn" type="button">▶ Open the case</button>
        <!-- TOPIC: start note -->
        <p>About 60 seconds, with sound. The narrator is your browser's built-in voice and the music is generated live.</p>
      </div>
      <div class="overlay" id="endOv" hidden>
        <button class="big-btn" id="replayBtn" type="button">↺ Replay the case</button>
        <!-- TOPIC: one-line verdict shown on the end card -->
        <p>A token is a puzzle piece of text. That's the whole case.</p>
      </div>
    </div>
  </div>
  <div class="ctl" id="ctl">
    <button id="playBtn" type="button">▶ Play</button>
    <button id="restartBtn" type="button">↺ Restart</button>
    <select id="voiceSel" aria-label="Narrator voice"><option>Loading voices…</option></select>
    <select id="rateSel" aria-label="Narration speed">
      <option value="0.9">Speed 0.9×</option><option value="1" selected>Speed 1×</option><option value="1.1">Speed 1.1×</option>
    </select>
    <button id="musicBtn" type="button" aria-pressed="true">Music</button>
    <button id="capBtn" type="button" aria-pressed="true">Captions</button>
    <div class="status" id="status">Press play. Tip: screen-record the stage to export a video.</div>
  </div>

<script>
/*STICKERS*/
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), wrap = $('#wrap'), board = $('#board');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Export mode: export.js sets window.__EXPORT__ and drives a virtual clock frame by frame (MP4 render).
const EXP = window.__EXPORT__ || null;
if (EXP) { EXP.t = 0; EXP.timers = []; EXP.sfxLog = []; EXP.speech = []; EXP.done = false; document.documentElement.classList.add('exporting'); }
const later = (fn, ms) => EXP ? EXP.timers.push({ at: EXP.t + ms / 1000, fn }) : setTimeout(fn, ms);

/* ---------- fit stage ---------- */
function fit() {
  if (EXP) { stage.style.transform = 'none'; wrap.style.width = '720px'; wrap.style.height = '1280px'; return; }
  const ctlH = $('#ctl').offsetHeight + 30;
  const aw = document.documentElement.clientWidth - 32, ah = window.innerHeight - ctlH;
  const s = Math.max(0.2, Math.min(aw / 720, ah / 1280));
  stage.style.transform = `scale(${s})`;
  wrap.style.width = 720 * s + 'px'; wrap.style.height = 1280 * s + 'px';
}
addEventListener('resize', fit);

/* ---------- procedural textures (desk wood, cork, paper grain) ---------- */
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c.toDataURL('image/jpeg', .88); }
function noise(g, w, h, amt, alpha) {
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; d[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
const deskTex = canvasTex(720, 1280, (g, w, h) => {
  g.fillStyle = '#1a130d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 520; i++) {               // long wood grain lines
    const y0 = R(-40, h + 40), amp = R(2, 14), fr = R(.002, .012), ph = R(0, 6);
    g.strokeStyle = `rgba(${rnd() < .5 ? '60,40,24' : '8,5,3'},${R(.08, .35)})`; g.lineWidth = R(.6, 2.6);
    g.beginPath(); for (let x = -10; x <= w + 10; x += 12) { const y = y0 + Math.sin(x * fr + ph) * amp + x * .05; x === -10 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  }
  noise(g, w, h, 14);
  const lg = g.createRadialGradient(400, 560, 40, 400, 600, 760);
  lg.addColorStop(0, 'rgba(255,196,120,.30)'); lg.addColorStop(.45, 'rgba(160,100,50,.10)'); lg.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
});
$('#desk').style.backgroundImage = `url(${deskTex})`;
const corkTex = canvasTex(720, 405, (g, w, h) => {
  g.fillStyle = '#a7774a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const s = R(.6, 3.2); g.fillStyle = rnd() < .55 ? `rgba(70,40,18,${R(.15, .55)})` : `rgba(230,190,140,${R(.1, .4)})`; g.beginPath(); g.ellipse(R(0, w), R(0, h), s, s * R(.5, 1), R(0, 3), 0, 7); g.fill(); }
  noise(g, w, h, 18);
});
board.style.backgroundImage = `url(${corkTex})`;
const paperTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#ededed'; g.fillRect(0, 0, w, h); noise(g, w, h, 22);
  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(90,70,40,${R(.03, .09)})`; g.lineWidth = R(.3, 1); g.beginPath(); const x = R(0, w), y = R(0, h); g.moveTo(x, y); g.lineTo(x + R(-20, 20), y + R(-6, 6)); g.stroke(); }
});
const newsBack = canvasTex(256, 256, (g, w, h) => {      // faint print showing through from the back of the clipping
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let y = 4; y < h; y += 7) { let x = R(-10, 0); while (x < w) { const wl = R(4, 20); if (x % 86 < 80) { g.fillStyle = `rgba(60,55,45,${R(.07, .13)})`; g.fillRect(x, y, wl, 2); } x += wl + R(3, 5); } }
});
const sheet = document.createElement('style');
sheet.textContent = `.paper,.manila,.card,.chip,.strip,.kicker{background-image:url(${paperTex});background-blend-mode:multiply}
.card{background-image:url(${paperTex}),repeating-linear-gradient(transparent 0 16px,rgba(80,110,150,.25) 16px 17px)}
.chip,.strip{background-image:url(${paperTex}),url(${newsBack})}`;
document.head.appendChild(sheet);

/* stamp grunge mask */
const grungeURL = (() => { const c = document.createElement('canvas'); c.width = c.height = 200; const g = c.getContext('2d'); const id = g.createImageData(200, 200);
  for (let i = 0; i < id.data.length; i += 4) id.data[i + 3] = rnd() < .13 ? 0 : 255; g.putImageData(id, 0, 0);
  for (let i = 0; i < 40; i++) g.clearRect(R(0, 200), R(0, 200), R(3, 16), R(1, 4)); return c.toDataURL(); })();

/* dust motes in the lamp beam */
const dctx = $('#dust').getContext('2d');
const motes = Array.from({ length: 46 }, () => ({ x: R(80, 700), y: R(80, 1200), r: R(.6, 2.2), vx: R(-.08, .08), vy: R(-.12, .03), a: R(.15, .5) }));
let dustOn = !reduced;
function drawDust() {
  dctx.clearRect(0, 0, 720, 1280);
  for (const m of motes) {
    if (dustOn && !(playing && paused)) { m.x += m.vx; m.y += m.vy; if (m.y < 40) m.y = 1240; if (m.x < 20) m.x = 700; if (m.x > 710) m.x = 30; }
    dctx.fillStyle = `rgba(255,220,170,${m.a})`; dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 7); dctx.fill();
  }
}

/* ---------- element builders ---------- */

  p.push(`calc(100% - ${c()}px) calc(100% - ${c()}px)`);
